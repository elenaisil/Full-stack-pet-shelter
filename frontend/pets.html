<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Pets - ADOPT Pet Shelter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img class="logo1" src="images/logoFinal.jpg" >
        <div class="logo">ADOPT <span>PET SHELTER</span></div>
        <div class="nav">
            <a href="index.html">HOME</a>
            <a href="pets.html" class="active">PETS</a>
            <a href="index.html#shelters">SHELTERS</a>
            <a href="about.html">ABOUT</a>
            <a href="index.html#contact">CONTACT</a>
        </div>
    </div>

    <div class="page-header">
        <h1>All Our Adorable Pets</h1>
        <p>Find your new best friend today!</p>
    </div>

    <div class="pets-section">
        <div id="allPetsList" class="pets-grid">
            <div class="loading">Loading pets...</div>
        </div>
    </div>

    <div class="footer" id="contact">
        <p>📍 Pecs, Hungary, 7633</p>
        <p>📞 +36 630-355-2299</p>
        <p>✉️ info@adoptpetshelter.org</p>
        <p style="margin-top: 20px;">&copy; 2026 ADOPT Pet Shelter. All rights reserved.</p>
    </div>

    <div id="adoptModal" class="modal">
        <div class="modal-content">
            <h3 id="adoptModalTitle">Adopt a Pet</h3>
            <input type="text" id="adopterName" placeholder="Full Name *" required>
            <input type="email" id="adopterEmail" placeholder="Email *" required>
            <input type="tel" id="adopterPhone" placeholder="Phone">
            <input type="text" id="adopterAddress" placeholder="Address">
            <input type="text" id="adopterCity" placeholder="City">
            <div class="modal-buttons">
                <button onclick="confirmAdoption()">Complete Adoption</button>
                <button onclick="closeAdoptModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
